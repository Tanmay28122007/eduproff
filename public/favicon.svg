<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="eduproof-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#059669" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded Background Container -->
  <rect width="64" height="64" rx="16" fill="url(#eduproof-grad)" filter="url(#glow)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />

